# Online Capacitor shells: keep the published HTTPS app available.
# iOS output is UNSIGNED, not ad-hoc signed or directly installable.
workflows:
  ios-ipa:
    name: MZGTA iPhone — unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: "26.0"
      vars:
        MZGTA_NATIVE_VIEW: phone
    scripts:
      - &install_deps
        name: Install dependencies
        script: |
          set -eu
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund
      - &build_web
        name: Build web app and prepare native shell
        script: |
          set -eu
          python3 scripts/prepare-source-offer.py
          npm run build
          node scripts/prepare-capacitor.mjs
      - &generate_ios
        name: Generate iOS and install native PS5 discovery and registration
        script: |
          set -eu
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
          python3 scripts/configure-native.py ios
          ruby <<'RUBY'
          require "xcodeproj"
          proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
          target = proj.targets.find { |item| item.name == "App" }
          abort "App target not found" unless target
          target.build_configurations.each do |config|
            settings = config.build_settings
            settings["SWIFT_VERSION"] = "5.0"
            settings["CLANG_ENABLE_MODULES"] = "YES"
            settings["HEADER_SEARCH_PATHS"] = (["$(inherited)"] + Array(settings["HEADER_SEARCH_PATHS"]) + ["$(SRCROOT)/App/Native/chiaki/include"]).uniq
            settings["CODE_SIGN_ENTITLEMENTS"] = "App/MZGTA.entitlements"
          end
          group = proj.main_group.find_subpath("App", true)
          sources = Dir.glob("ios/App/App/**/*.{swift,m,c}").reject { |f| f.end_with?("AppDelegate.swift") }
          if sources.any? { |f| File.extname(f) == ".c" }
            header = "ios/App/App/App-Bridging-Header.h"
            File.write(header, "#pragma once\n#import \"Native/MZGTA-Bridging-Header.h\"\n")
            target.build_configurations.each do |config|
              config.build_settings["SWIFT_OBJC_BRIDGING_HEADER"] = "App/App-Bridging-Header.h"
            end
          end
          # A source path may occur only once in the App target, even if a
          # previous generator used a different file-reference UUID.
          registered = {}
          target.source_build_phase.files.dup.each do |build_file|
            ref = build_file.file_ref
            next unless ref
            path = ref.real_path.to_s
            if registered.key?(path)
              index = target.source_build_phase.files.index { |item| item.uuid == build_file.uuid }
              target.source_build_phase.files.delete_at(index) if index
              proj.objects_by_uuid.delete(build_file.uuid)
            else
              registered[path] = ref
            end
          end
          Dir.glob("ios/App/App/**/*.{swift,m,c,h}").sort.each do |file|
            next if file.end_with?("AppDelegate.swift")
            path = File.expand_path(file)
            ref = registered[path] || proj.files.find { |item| item.real_path.to_s == path } || group.new_file(path)
            next if File.extname(file) == ".h"
            unless registered.key?(path)
              target.add_file_references([ref])
              registered[path] = ref
            end
            if File.extname(file) == ".c" && file.include?("/Native/chiaki/")
              build_file = target.source_build_phase.files.find { |item| item.file_ref.real_path.to_s == path }
              build_file.settings ||= {}
              flags = build_file.settings.fetch("COMPILER_FLAGS", "").split
              flags |= ["-DCHIAKI_APPLE_CRYPTO=1"]
              build_file.settings["COMPILER_FLAGS"] = flags.join(" ")
            end
          end
          proj.save
          RUBY
          ruby scripts/add-broadcast-extension.rb ios/App/App.xcodeproj
          grep -Eq 'path = "?MZGTABroadcast\.appex"?;' ios/App/App.xcodeproj/project.pbxproj || { echo 'MZGTABroadcast product is not named MZGTABroadcast.appex'; exit 1; }
          plutil -lint ios/App/MZGTABroadcast/Info.plist ios/App/MZGTABroadcast/MZGTABroadcast.entitlements
          plutil -lint ios/App/App/Info.plist ios/App/App.xcodeproj/project.pbxproj ios/App/App/MZGTA.entitlements
          sh scripts/check-native-ios.sh ios
          sh scripts/test-remote-play-crypto.sh
          sips -z 1024 1024 public/icons/mzgta-512.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Build unsigned iPhone app and package MZGTA.ipa
        script: |
          set -eu
          mkdir -p build/ios
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            -resultBundlePath build/ios/MZGTA-build.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_VERSION=5.0 \
            build
          test -d build/ios/Build/Products/Release-iphoneos/App.app
          test -d build/ios/Build/Products/Release-iphoneos/App.app/PlugIns/MZGTABroadcast.appex
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          (cd build/ipa && zip -qry MZGTA.ipa Payload)
    artifacts:
      - build/ipa/MZGTA.ipa
      - build/ios/MZGTA-build.xcresult

  # Signed App Store build uploaded to TestFlight. Needs a paid Apple Developer
  # account and the Codemagic group "appstore_credentials" with
  # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
  # APP_STORE_CONNECT_PRIVATE_KEY and CERTIFICATE_PRIVATE_KEY. Both App IDs
  # need the App Group group.com.mzgta.app. Multicast (PS5 pairing) is only
  # needed when MZGTA_MULTICAST is "1". Upload happens only after a
  # successful signed build (Codemagic publishing step).
  ios-testflight:
    name: MZGTA iPhone — signed TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: "26.0"
      groups:
        - appstore_credentials
      vars:
        MZGTA_NATIVE_VIEW: phone
        # "0" = no multicast entitlement, PS5 pairing hidden. Set to "1" after Apple approves multicast.
        MZGTA_MULTICAST: "0"
    scripts:
      - *install_deps
      - *build_web
      - *generate_ios
      - name: Check Apple credentials
        script: |
          set -eu
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "Missing $v in Codemagic group appstore_credentials"; exit 1; }
          done
      - name: Fetch App Store signing files for app and subtitle extension
        script: |
          set -eu
          keychain initialize
          app-store-connect fetch-signing-files "com.mzgta.app" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.mzgta.app.MZGTABroadcast" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Set unique build number for TestFlight
        script: |
          set -eu
          (cd ios/App && agvtool new-version -all "${BUILD_NUMBER:-1}")
      - name: Build signed MZGTA.ipa
        script: |
          set -eu
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App --config Release
          ls build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-apk:
    name: MZGTA Android TV — debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      vars:
        MZGTA_NATIVE_VIEW: tv
    scripts:
      - name: Install dependencies
        script: |
          set -eu
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build web app and prepare native shell
        script: |
          set -eu
          python3 scripts/prepare-source-offer.py
          npm run build
          node scripts/prepare-capacitor.mjs
      - name: Generate and sync Android TV launcher
        script: |
          set -eu
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          python3 scripts/configure-native.py android
      - name: Install required Android SDK
        script: |
          set -eu
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build and rename debug APK
        script: |
          set -eu
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon)
          mkdir -p build/android
          cp android/app/build/outputs/apk/debug/app-debug.apk build/android/MZGTA-TV.apk
    artifacts:
      - build/android/MZGTA-TV.apk
